name: Build Docker Image (Pull Request)

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: happy:pr-${{ github.event.pull_request.number || github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/happy-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: happy-image-pr-${{ github.event.pull_request.number || github.sha }}
          path: ${{ runner.temp }}/happy-image.tar
          retention-days: 7