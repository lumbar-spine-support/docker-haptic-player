name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      relay_release_created: ${{ steps.release.outputs['dglab-relay--release_created'] }}
      relay_tag_name: ${{ steps.release.outputs['dglab-relay--tag_name'] }}
      relay_version: ${{ steps.release.outputs['dglab-relay--version'] }}
    steps:
      - name: Create/update the release PR, or tag a release when it is merged
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Set release title
        run: gh release edit "$RELEASE_TAG" --title "HAPPY v${VERSION}" --repo "${{ github.repository }}"

      - name: Add install instructions to the release notes
        run: |
          manifest="https://raw.githubusercontent.com/${{ github.repository }}/jellyfin-plugin-repository/manifest.json"
          body="$(gh release view "$RELEASE_TAG" --json body --jq .body --repo "${{ github.repository }}")"
          if [[ "$body" != *"$manifest"* ]]; then
            notes="$(printf '%s\n\nInstall or update HAPPY through its Jellyfin plugin repository: %s (Dashboard → Plugins → Repositories), or download `happy_%s.0.zip` below.' "$body" "$manifest" "$VERSION")"
            gh release edit "$RELEASE_TAG" --notes "$notes" --repo "${{ github.repository }}"
          fi

  # The DG-Lab relay has its own release cycle (component dglab-relay, tags dglab-relay-v*).
  publish-dglab-relay:
    needs: release
    if: ${{ needs.release.outputs.relay_release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.relay_tag_name }}
      VERSION: ${{ needs.release.outputs.relay_version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/happy-dglab-relay
    steps:
      - name: Checkout the tagged release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.relay_tag_name }}

      - name: Title the release and keep "Latest" on HAPPY
        run: |
          gh release edit "$RELEASE_TAG" --title "HAPPY DG-Lab relay v${VERSION}" --latest=false
          happy_tag="$(gh release list --exclude-drafts --exclude-pre-releases --json tagName --jq '[.[] | select(.tagName | startswith("v"))][0].tagName')"
          if [ -n "$happy_tag" ]; then gh release edit "$happy_tag" --latest; fi
          body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          if [[ "$body" != *"$IMAGE:$VERSION"* ]]; then
            gh release edit "$RELEASE_TAG" --notes "$(printf '%s\n\n```\ndocker pull %s:%s\n```' "$body" "$IMAGE" "$VERSION")"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.relay_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.relay_version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.relay_version }}

      - name: Build and push the relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dglab-relay/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: index:org.opencontainers.image.description="WebSocket relay between HAPPY and the DG-Lab app."
          cache-from: type=gha,scope=dglab-relay
          cache-to: type=gha,mode=max,scope=dglab-relay

  # Jellyfin installs and updates the plugin from manifest.json on the jellyfin-plugin-repository
  # branch; every version entry points at the zip attached to its GitHub release.
  publish-jellyfin-plugin:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    concurrency: jellyfin-plugin-repository
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
      REPOSITORY_BRANCH: jellyfin-plugin-repository
    steps:
      - name: Checkout the tagged release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          # The plugin embeds the docs, whose images are in LFS.
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build the client
        run: |
          npm ci
          npm run build:client
          npm run build:vendor

      - name: Test plugin
        run: dotnet test jellyfin-plugin/Jellyfin.Plugin.Happy.slnx

      - name: Package plugin
        id: package
        env:
          HAPPY_COMMIT: ${{ github.sha }}
        run: |
          HAPPY_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" sh jellyfin-plugin/package.sh
          zip="$(ls jellyfin-plugin/artifacts/happy_*.zip)"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$zip")" >> "$GITHUB_OUTPUT"

      - name: Attach the zip to the release
        run: gh release upload "$RELEASE_TAG" "${{ steps.package.outputs.zip }}" --clobber

      # Stable releases go into both manifests; in manifest-beta.json the release replaces the
      # betas before it (happy-plugin-beta.yml publishes those), whose zips are then deleted.
      - name: Add the release to manifest.json and manifest-beta.json
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/changelog.md"
          cat > "$RUNNER_TEMP/add-release.sh" <<'SH'
          set -eu
          for manifest in manifest.json manifest-beta.json; do
            set -- --manifest "repository/$manifest" --zip "$ZIP" --url "$URL" --changelog-file "$RUNNER_TEMP/changelog.md"
            if [ "$manifest" = manifest-beta.json ]; then
              set -- "$@" --seed repository/manifest.json --prune-betas 5 --pruned-file "$RUNNER_TEMP/pruned.txt"
            fi
            node --import tsx scripts/jellyfin-plugin-manifest.ts "$@"
          done
          SH
          sh scripts/update-plugin-repository.sh "chore: add ${RELEASE_TAG} to the Jellyfin plugin manifests" \
            sh "$RUNNER_TEMP/add-release.sh"
        env:
          ZIP: ${{ steps.package.outputs.zip }}
          URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.release.outputs.tag_name }}/${{ steps.package.outputs.name }}

      - name: Delete the zips of pruned betas
        run: sh scripts/delete-pruned-betas.sh "$RUNNER_TEMP/pruned.txt"
