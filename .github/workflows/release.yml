name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Create/update the release PR, or tag a release when it is merged
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  update-release-pr:
    needs: release
    if: ${{ needs.release.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
      # Release-please regenerates its branch on every run, so the docs commit is re-applied each time.
      - name: Checkout the release PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(needs.release.outputs.pr).headBranchName }}
          # A PAT/App token lets the push trigger CI on the PR; GITHUB_TOKEN pushes do not.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate environment variable docs
        run: npm run docs:env

      - name: Commit updated docs to the release PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/
          if git diff --cached --quiet; then
            echo "Docs are up to date."
          else
            git commit -m "docs: update environment variable documentation"
            git push
          fi

  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          lfs: true

      - name: Set release title
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release edit "$RELEASE_TAG" --title "HAPPY v${VERSION}"

      - name: Add Docker package link to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          package_link="https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}"
          image_ref="ghcr.io/${{ github.repository }}:${VERSION}"
          body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          if [[ "$body" != *"$image_ref"* ]]; then
            notes="$(printf '%s\n\nDocker image: %s\n\n```\ndocker pull %s\n```' "$body" "$package_link" "$image_ref")"
            gh release edit "$RELEASE_TAG" --notes "$notes"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}
            type=raw,value=stable

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: index:org.opencontainers.image.description="HAPPY is a self-hosted haptic player for audio and video files."
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
            APP_CHANNEL=stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Jellyfin installs and updates the plugin from manifest.json on the jellyfin-plugin-repository
  # branch; every version entry points at the zip attached to its GitHub release.
  publish-jellyfin-plugin:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    concurrency: jellyfin-plugin-repository
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
      REPOSITORY_BRANCH: jellyfin-plugin-repository
    steps:
      - name: Checkout the tagged release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test plugin
        run: dotnet test jellyfin-plugin/Jellyfin.Plugin.Happy.slnx

      - name: Package plugin
        id: package
        env:
          HAPPY_COMMIT: ${{ github.sha }}
        run: |
          HAPPY_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" sh jellyfin-plugin/package.sh
          zip="$(ls jellyfin-plugin/artifacts/happy_*.zip)"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$zip")" >> "$GITHUB_OUTPUT"

      - name: Attach the zip to the release
        run: gh release upload "$RELEASE_TAG" "${{ steps.package.outputs.zip }}" --clobber

      - name: Checkout the plugin repository branch
        run: |
          if git fetch --depth=1 origin "$REPOSITORY_BRANCH"; then
            git worktree add -B "$REPOSITORY_BRANCH" repository FETCH_HEAD
          else
            git worktree add --orphan -b "$REPOSITORY_BRANCH" repository
          fi

      - name: Add the release to manifest.json
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/changelog.md"
          node --import tsx scripts/jellyfin-plugin-manifest.ts \
            --manifest repository/manifest.json \
            --zip "${{ steps.package.outputs.zip }}" \
            --url "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${{ steps.package.outputs.name }}" \
            --changelog-file "$RUNNER_TEMP/changelog.md"

      - name: Push manifest.json
        working-directory: repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: add ${RELEASE_TAG} to the Jellyfin plugin manifest"
          git push origin "HEAD:refs/heads/$REPOSITORY_BRANCH"
