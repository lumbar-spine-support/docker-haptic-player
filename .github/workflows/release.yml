name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Create/update the release PR, or tag a release when it is merged
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  update-release-pr:
    needs: release
    if: ${{ needs.release.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
      # Release-please regenerates its branch on every run, so the docs commit is re-applied each time.
      - name: Checkout the release PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(needs.release.outputs.pr).headBranchName }}
          # A PAT/App token lets the push trigger CI on the PR; GITHUB_TOKEN pushes do not.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate environment variable docs
        run: npm run docs:env

      - name: Commit updated docs to the release PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/
          if git diff --cached --quiet; then
            echo "Docs are up to date."
          else
            git commit -m "docs: update environment variable documentation"
            git push
          fi

  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          lfs: true

      - name: Add Docker package link to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          package_link="https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}"
          image_ref="ghcr.io/${{ github.repository }}:${RELEASE_TAG##*-v}"
          body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          if [[ "$body" != *"$image_ref"* ]]; then
            notes="$(printf '%s\n\nDocker image: %s\n\n```\ndocker pull %s\n```' "$body" "$package_link" "$image_ref")"
            gh release edit "$RELEASE_TAG" --notes "$notes"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag_name }}
            type=raw,value=stable

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: index:org.opencontainers.image.description="HAPPY is a self-hosted haptic player for audio and video files."
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
            APP_CHANNEL=stable
          cache-from: type=gha
          cache-to: type=gha,mode=max
