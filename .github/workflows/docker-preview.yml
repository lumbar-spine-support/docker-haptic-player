name: Build DG-Lab Relay Image (Preview)

# HAPPY itself previews as the plugin build artifact of every test run (jellyfin-plugin-happy);
# only the relay has an image to preview.
on:
  push:
    branches:
      - dev
    paths:
      - "dglab-relay/**"
      - "src/shared/dglab.ts"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/happy-dglab-relay
          flavor: |
            latest=false
          tags: |
            type=raw,value=preview
            type=raw,value=preview-{{sha}}

      - name: Build and push the relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dglab-relay/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: index:org.opencontainers.image.description="WebSocket relay between HAPPY and the DG-Lab app."
          cache-from: type=gha,scope=dglab-relay
          cache-to: type=gha,mode=max,scope=dglab-relay
