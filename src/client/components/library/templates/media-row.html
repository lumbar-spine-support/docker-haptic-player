<td class="align-middle p-1 d-none d-md-table-cell">
    <img src="{{artSrc}}" alt="" class="rounded track-art-thumb" loading="lazy" decoding="async" width="40" height="40"
        onerror="this.onerror=null;this.src='{{{fallbackArt}}}'">
</td>
<td class="align-middle fw-semibold text-truncate" style="max-width:14rem">{{title}}</td>
<td class="align-middle text-muted text-truncate" style="max-width:10rem">{{artist}}</td>
<td class="align-middle text-muted d-none d-md-table-cell">{{type}}</td>
<td class="align-middle text-muted d-none d-md-table-cell">{{year}}</td>
<td class="align-middle d-none d-md-table-cell">
    <div class="d-flex flex-wrap gap-1">{{{hapticIcons}}}</div>
</td>
<td class="align-middle text-muted d-none d-md-table-cell">{{duration}}</td>
