<a href="{{href}}" class="card shadow track-card bg-dark text-light border-secondary text-decoration-none h-100">
    <img src="{{artSrc}}" class="card-img-top track-art" alt="{{altText}}"
        onerror="this.onerror=null;this.src='{{{fallbackArt}}}'">
    <div class="card-body p-2 d-flex flex-column">
        <div class="card-title mb-0 fw-semibold text-truncate small">{{title}}</div>
        <div class="text-muted text-truncate" style="font-size:.75rem">{{subtitle}}</div>
        <div class="mt-auto d-flex align-items-center justify-content-between gap-2">
            <span class="text-muted text-uppercase text-truncate" style="font-size:.65rem">{{meta}}</span>
            <span class="d-inline-flex gap-1">{{{hapticIcons}}}</span>
        </div>
    </div>
</a>
