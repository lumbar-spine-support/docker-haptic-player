<div class="device-feature mb-1">
    <div class="d-flex align-items-center gap-2">
        <button type="button"
            class="btn btn-link btn-sm p-0 text-muted text-decoration-none d-flex align-items-center gap-1 device-feature-toggle"
            data-bs-toggle="collapse" data-bs-target="#{{detailsId}}" aria-expanded="{{expanded}}"
            aria-controls="{{detailsId}}">
            <i class="bi bi-chevron-right device-feature-chevron" aria-hidden="true"></i>
            <span class="device-role-icon {{iconClass}} flex-shrink-0"></span>
            <span class="small text-truncate">{{label}}</span>
        </button>
        <select class="form-select form-select-sm bg-dark text-light border-secondary" data-feature-select
            aria-label="Assign script for {{ariaLabel}}"></select>
    </div>
    <div class="{{collapseClass}}" id="{{detailsId}}">
        <div class="device-feature-details small text-muted">{{{details}}}</div>
    </div>
</div>
