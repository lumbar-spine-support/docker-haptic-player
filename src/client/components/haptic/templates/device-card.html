<div class="device-card mt-2 p-2 border border-secondary rounded bg-dark">
    <div class="d-flex align-items-center gap-2 mb-2">
        <span class="fw-semibold text-truncate flex-grow-1 small" title="{{name}}">{{name}}</span>
        <span class="text-muted small flex-shrink-0" data-device-battery></span>
        {{{badge}}}
    </div>
    <div data-device-controls></div>
    <div data-device-features></div>
    {{{alerts}}}
</div>
